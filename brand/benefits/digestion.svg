<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- საჭმლის მონელება — herbal tea: cup with mint leaves and a soft spiral of steam -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9C99A"/>
      <stop offset=".5" stop-color="#5E8C61"/>
      <stop offset="1" stop-color="#14241A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".4">
      <stop offset="0" stop-color="#F7F5F0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F7F5F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <!-- steam spiral -->
  <g fill="none" stroke="#F7F5F0" stroke-width="9" stroke-linecap="round" opacity=".85">
    <path d="M370 290 C340 250 400 240 380 200 C364 170 396 150 400 130"/>
    <path d="M430 290 C410 262 450 250 438 218 C430 196 450 182 452 168" opacity=".7"/>
  </g>
  <!-- cup -->
  <path d="M276 310 L524 310 Q520 450 430 476 L370 476 Q280 450 276 310 Z" fill="#F7F5F0" stroke="#1B3022" stroke-width="8" stroke-linejoin="round"/>
  <path d="M520 336 Q588 330 584 380 Q580 426 506 418" fill="none" stroke="#1B3022" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="400" cy="312" rx="124" ry="16" fill="#B8CF8A" stroke="#1B3022" stroke-width="7"/>
  <path d="M300 380 Q400 404 500 380" fill="none" stroke="#C86D51" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <!-- saucer -->
  <ellipse cx="400" cy="486" rx="170" ry="22" fill="#E7EEE6" stroke="#1B3022" stroke-width="7"/>
  <!-- mint leaves -->
  <g stroke="#1B3022" stroke-width="6" stroke-linejoin="round">
    <path d="M200 300 C180 250 210 206 266 206 C272 258 248 294 200 300 Z" fill="#3E8A5F"/>
    <path d="M610 240 C640 206 624 160 570 156 C552 206 568 236 610 240 Z" fill="#4E9A6A"/>
    <path d="M566 470 C604 470 630 438 616 398 C578 402 560 432 566 470 Z" fill="#3E8A5F"/>
  </g>
  <g stroke="#1B3022" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M204 294 L260 214"/><path d="M606 234 L574 164"/><path d="M570 464 L612 404"/>
  </g>
  <!-- small leaf floating in the tea -->
  <path d="M376 312 C384 296 412 294 426 306 C414 320 390 322 376 312 Z" fill="#3E8A5F" stroke="#1B3022" stroke-width="4"/>
  <g fill="#F7F5F0" opacity=".6"><circle cx="160" cy="150" r="4"/><circle cx="660" cy="320" r="4"/><circle cx="130" cy="420" r="3"/></g>
</svg>
