<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- ძილი და სტრესის მოხსნა — calm night: crescent moon, stars, a reishi cap and lemon-balm leaves -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B3466"/>
      <stop offset=".5" stop-color="#2A2B4A"/>
      <stop offset="1" stop-color="#121A20"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F6E7B8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F6E7B8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(0 -80)">
  <!-- stars -->
  <g fill="#F7F5F0">
    <circle cx="150" cy="130" r="4"/><circle cx="250" cy="90" r="3"/><circle cx="640" cy="110" r="4"/><circle cx="700" cy="230" r="3"/>
    <circle cx="120" cy="300" r="3"/><circle cx="560" cy="70" r="2.5"/><circle cx="330" cy="170" r="2.5"/>
  </g>
  <path d="M560 200 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8 Z" fill="#F6E7B8"/>
  <path d="M210 210 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#F6E7B8" opacity=".8"/>
  <!-- moon -->
  <circle cx="400" cy="270" r="190" fill="url(#halo)"/>
  <path d="M452 152 A128 128 0 1 0 512 380 A104 104 0 1 1 452 152 Z" fill="#F6E7B8" stroke="#1B3022" stroke-width="7" stroke-linejoin="round"/>
  <!-- reishi (kidney-shaped glossy cap) -->
  <path d="M276 470 C276 420 336 392 400 392 C470 392 524 424 520 468 Q470 452 400 456 Q330 456 276 470 Z" fill="#8E3B2E" stroke="#1B3022" stroke-width="7" stroke-linejoin="round"/>
  <path d="M300 456 C330 430 470 428 500 452" fill="none" stroke="#D9906B" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <path d="M332 440 C360 418 440 418 470 436" fill="none" stroke="#E9B087" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  <path d="M392 456 L388 540 Q388 548 398 548 L408 548 Q416 548 416 540 L412 456 Z" fill="#D9C7A6" stroke="#1B3022" stroke-width="7" stroke-linejoin="round"/>
  <!-- lemon balm leaves -->
  <g stroke="#1B3022" stroke-width="6" stroke-linejoin="round">
    <path d="M250 560 C230 520 250 480 300 476 C310 520 292 552 250 560 Z" fill="#6F9A6B"/>
    <path d="M556 556 C586 528 580 484 530 474 C512 514 522 548 556 556 Z" fill="#6F9A6B"/>
  </g>
  <g stroke="#1B3022" stroke-width="3" stroke-linecap="round" fill="none" opacity=".6">
    <path d="M254 554 L292 486"/><path d="M552 550 L534 482"/>
  </g>
  <!-- gentle "zz" -->
  <g fill="none" stroke="#F7F5F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <path d="M600 300 h28 l-28 30 h28"/><path d="M640 262 h20 l-20 22 h20"/>
  </g>
  </g>
</svg>
